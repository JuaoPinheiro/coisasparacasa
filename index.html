<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coisas para Casa · Achadinhos</title>
<meta name="description" content="Todos os achadinhos dos vídeos da Coisas para Casa, com o link de cada produto.">
<style>
  :root { --laranja:#FF6A13; --tinta:#2b1d14; --fundo:#fff7f1; --card:#ffffff; --suave:#7a6a5f; --borda:#f1e2d6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--fundo); color:var(--tinta); }
  header { text-align:center; padding:28px 16px 8px; }
  header img { width:84px; height:84px; border-radius:50%; box-shadow:0 6px 20px rgba(255,106,19,.25); }
  h1 { font-size:1.35rem; margin:10px 0 4px; }
  header p { margin:0; color:var(--suave); font-size:.95rem; }
  .busca { position:sticky; top:0; z-index:2; background:var(--fundo); padding:12px 16px 8px; max-width:720px; margin:0 auto; }
  .busca input { width:100%; font-size:1rem; padding:14px 16px; border-radius:14px; border:2px solid var(--borda); background:#fff; outline:none; }
  .busca input:focus { border-color:var(--laranja); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:10px 0 2px; scrollbar-width:none; }
  .chips button { flex:none; border:2px solid var(--borda); background:#fff; color:var(--tinta); padding:8px 14px; border-radius:999px; font-size:.9rem; font-weight:600; cursor:pointer; }
  .chips button[aria-pressed="true"] { background:var(--laranja); border-color:var(--laranja); color:#fff; }
  main { max-width:720px; margin:0 auto; padding:6px 16px 32px; display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .card { background:var(--card); border-radius:16px; overflow:hidden; border:1px solid var(--borda); display:flex; flex-direction:column; text-decoration:none; color:inherit; }
  .foto { position:relative; aspect-ratio:1; background:#f4ece6; }
  .foto img { width:100%; height:100%; object-fit:cover; display:block; }
  .num { position:absolute; top:8px; left:8px; background:var(--laranja); color:#fff; font-weight:800; font-size:.95rem; padding:4px 10px; border-radius:999px; }
  .novo { position:absolute; top:8px; right:8px; background:var(--tinta); color:#fff; font-size:.7rem; font-weight:700; padding:4px 8px; border-radius:999px; }
  .info { padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .nome { font-weight:700; font-size:.95rem; line-height:1.25; }
  .loja { font-size:.75rem; color:var(--suave); }
  .btn { margin-top:auto; text-align:center; background:var(--laranja); color:#fff; font-weight:700; padding:10px; border-radius:10px; font-size:.9rem; }
  .vazio { grid-column:1/-1; text-align:center; color:var(--suave); padding:32px 0; }
  footer { text-align:center; color:var(--suave); font-size:.75rem; padding:0 16px 28px; max-width:560px; margin:0 auto; line-height:1.5; }
  @media (min-width:640px) { main { grid-template-columns:repeat(3,1fr); } }
</style>
</head>
<body>
<header>
  <img src="logo.jpg" alt="Coisas para Casa">
  <h1>Achadinhos da Coisas para Casa</h1>
  <p>Viu no vídeo? Procure pelo <b>número</b> ou pelo nome 👇</p>
</header>
<div class="busca">
  <input id="q" type="search" inputmode="search" placeholder="Ex.: 5 ou lixeira" aria-label="Buscar produto pelo número ou nome">
  <div class="chips" id="chips" role="group" aria-label="Filtrar por categoria"></div>
</div>
<main id="lista" aria-live="polite"></main>
<footer>
  Links de afiliado: se você comprar por eles, a loja me paga uma pequena comissão e o preço para você não muda.
  Preço e estoque são definidos pela loja. Atualizado em 27/11/2026.
</footer>
<script>
const PRODUTOS = [{"n": 23, "slug": "cortina-4-00x2-80", "nome": "Cortina 4,00x2,80 Metros Blackout Blecaute Pr", "cat": "Decoração", "loja": "Mercado Livre", "link": "https://meli.la/2X5rE1D", "data": "2026-11-27"}, {"n": 22, "slug": "arvore-de-natal-olly", "nome": "Árvore de Natal Olly Pop 2.1m Verde Tradicion", "cat": "Árvores de Natal", "loja": "Mercado Livre", "link": "https://meli.la/27pjSwJ", "data": "2026-11-27"}, {"n": 21, "slug": "sabao-liquido-omo-lavagem", "nome": "Sabão Líquido Omo Lavagem Perfeita 3l", "cat": "Cuidado da Casa e Lavanderia", "loja": "Mercado Livre", "link": "https://meli.la/2NrmL3Y", "data": "2026-11-26"}, {"n": 20, "slug": "garrafa-termica-quick-flip", "nome": "Garrafa Térmica Quick Flip Stanley Charcoal 7", "cat": "Cozinha", "loja": "Mercado Livre", "link": "https://meli.la/2pFqEqJ", "data": "2026-11-26"}, {"n": 19, "slug": "jogo-talheres-faqueiro-buzios", "nome": "Jogo Talheres Faqueiro Búzios Aço Inox 24 Peç", "cat": "Cozinha", "loja": "Mercado Livre", "link": "https://meli.la/2j3Hkha", "data": "2026-11-25"}, {"n": 18, "slug": "kit-10-potes-vidro", "nome": "Kit 10 Potes Vidro Hermético Aristus 640ml Ma", "cat": "Cozinha", "loja": "Mercado Livre", "link": "https://meli.la/2oEkLyH", "data": "2026-11-25"}, {"n": 17, "slug": "lava-roupas-liquido-tixan", "nome": "Lava Roupas Líquido Tixan Ypê Primavera 7 Lit", "cat": "Cuidado da Casa e Lavanderia", "loja": "Mercado Livre", "link": "https://meli.la/1zQZ3ar", "data": "2026-11-24"}, {"n": 16, "slug": "escorredor-de-loucas-2", "nome": "Escorredor de Louças 2 Andares Zelvi Aço Carb", "cat": "Organização para Casa", "loja": "Mercado Livre", "link": "https://meli.la/2DZHLSL", "data": "2026-11-24"}, {"n": 15, "slug": "papel-higienico-neve-supreme", "nome": "Papel Higiênico Neve Supreme Folha Tripla, Ki", "cat": "Cuidado da Casa e Lavanderia", "loja": "Mercado Livre", "link": "https://meli.la/1ZJmAYE", "data": "2026-11-23"}, {"n": 14, "slug": "papel-higienico-folha-dupla", "nome": "Papel Higiênico Folha Dupla 30m L24p22 Person", "cat": "Cuidado da Casa e Lavanderia", "loja": "Mercado Livre", "link": "https://meli.la/1xxU4js", "data": "2026-11-23"}, {"n": 13, "slug": "kit-10-potes-hermeticos", "nome": "Kit 10 Potes Herméticos Vidro 640ml Starhouse", "cat": "Cozinha", "loja": "Mercado Livre", "link": "https://meli.la/2DtaGmf", "data": "2026-11-22"}, {"n": 12, "slug": "sacos-a-vacuo-viagem", "nome": "Sacos A Vácuo viagem Kit 10 Com Bomba Elétric", "cat": "Organização para Casa", "loja": "Mercado Livre", "link": "https://meli.la/235GppV", "data": "2026-11-22"}, {"n": 11, "slug": "lava-roupas-liquido-omo", "nome": "Lava Roupas Líquido Omo Lavanderia Profission", "cat": "Cuidado da Casa e Lavanderia", "loja": "Mercado Livre", "link": "https://meli.la/2edNHe1", "data": "2026-11-21"}, {"n": 10, "slug": "kit-10-pote-de", "nome": "Kit 10 Pote De Vidro Marmita Hermético 640ml ", "cat": "Cozinha", "loja": "Mercado Livre", "link": "https://meli.la/1Kq2bPE", "data": "2026-11-21"}, {"n": 9, "slug": "escova-eletrica", "nome": "Escova elétrica de limpeza", "cat": "Limpeza", "loja": "Mercado Livre", "link": "https://meli.la/1ok4Qbu", "data": "2026-11-20"}, {"n": 8, "slug": "mini-mixer", "nome": "Mini mixer 2 em 1 recarregável", "cat": "Cozinha", "loja": "Mercado Livre", "link": "https://meli.la/13DiDvJ", "data": "2026-11-20"}, {"n": 7, "slug": "escorredor-suspenso", "nome": "Escorredor suspenso com armário", "cat": "Organização", "loja": "Mercado Livre", "link": "https://meli.la/1F1NzLA", "data": "2026-11-19"}, {"n": 6, "slug": "cortador-legumes", "nome": "Cortador de legumes 16 peças", "cat": "Cozinha", "loja": "Mercado Livre", "link": "https://meli.la/1prQUTW", "data": "2026-11-19"}, {"n": 5, "slug": "lixeira-sensor", "nome": "Lixeira automática com sensor", "cat": "Cozinha", "loja": "Mercado Livre", "link": "https://meli.la/1j2Ryaq", "data": "2026-11-19"}, {"n": 4, "slug": "utensilios-silicone", "nome": "Utensílios de silicone", "cat": "Cozinha", "loja": "Shopee", "link": "https://s.shopee.com.br/1qdedSzUTX", "data": "2026-11-17"}, {"n": 3, "slug": "potes-hermeticos", "nome": "Potes herméticos empilháveis", "cat": "Organização", "loja": "Shopee", "link": "https://s.shopee.com.br/2LZvBGwDU1", "data": "2026-11-17"}, {"n": 2, "slug": "mini-processador", "nome": "Mini processador sem fio", "cat": "Cozinha", "loja": "Shopee", "link": "https://s.shopee.com.br/8pnOwK1CQM", "data": "2026-11-16"}, {"n": 1, "slug": "potes-marmitas", "nome": "Kit marmitas com trava lateral", "cat": "Cozinha", "loja": "Shopee", "link": "https://s.shopee.com.br/1BNxpsFids", "data": "2026-11-16"}];
const lista = document.getElementById('lista'), q = document.getElementById('q'), chips = document.getElementById('chips');
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const maisNovo = PRODUTOS.reduce((m, p) => p.data > m ? p.data : m, '');
let cat = 'Todos';
['Todos', ...new Set(PRODUTOS.map(p => p.cat))].forEach(c => {
  const b = document.createElement('button');
  b.textContent = c; b.setAttribute('aria-pressed', c === cat);
  b.onclick = () => { cat = c; [...chips.children].forEach(x => x.setAttribute('aria-pressed', x === b)); render(); };
  chips.appendChild(b);
});
function render() {
  const t = norm(q.value.trim().replace(/^#/, ''));
  const itens = PRODUTOS.filter(p => (cat === 'Todos' || p.cat === cat) &&
    (!t || (/^\d+$/.test(t) ? String(p.n) === t : norm(p.nome + ' ' + p.cat).includes(t))));
  lista.innerHTML = '';
  if (!itens.length) { lista.innerHTML = '<p class="vazio">Nada encontrado. Tente outro número ou palavra.</p>'; return; }
  for (const p of itens) {
    const a = document.createElement('a');
    a.className = 'card'; a.href = p.link; a.target = '_blank'; a.rel = 'nofollow sponsored noopener';
    a.innerHTML = `<div class="foto"><img loading="lazy" alt=""><span class="num">Nº ${p.n}</span>${p.data === maisNovo ? '<span class="novo">NOVO</span>' : ''}</div>
      <div class="info"><div class="nome"></div><div class="loja"></div><span class="btn">Ver produto</span></div>`;
    a.querySelector('img').src = 'img/' + p.slug + '.jpg';
    a.querySelector('.nome').textContent = p.nome;
    a.querySelector('.loja').textContent = (p.loja === 'Mercado Livre' ? 'no ' : 'na ') + p.loja;
    lista.appendChild(a);
  }
}
q.addEventListener('input', render);
render();
</script>
</body>
</html>
